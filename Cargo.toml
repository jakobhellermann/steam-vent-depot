[package]
name = "steam-vent-depot"
version = "0.1.0"
edition = "2024"
description = "Steam depot manifest and CDN client built on steam-vent"
license = "MIT"
repository = "todo"

[dependencies]
aes = "0.9"
base64 = "0.22"
cbc = "0.2"
indexmap = { version = "2", features = ["serde"] }
lzma-rs = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
steam-vent = "0.5"
steam-vent-proto = "0.5"
steam-vent-proto-common = "0.5"
thiserror = "2"
tokio = { version = "1.47", features = ["rt"] }
tracing = "0.1"
vdf-reader = "0.3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
anyhow = "1"
directories = "6"
futures-util = "0.3"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3"
